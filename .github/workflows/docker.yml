name: Docker

on:
  push:
    branches:
      - smart_core
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - '.github/workflows/issues.yml'
  pull_request:
    branches:
      - smart_core
      - main
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 额外镜像标签（Sync Upstream 同步上游时填入，例如 upstream-2.0.4-acae711）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GHCR 只接受全小写仓库名，HKMV/... 需要先转小写
      - name: Resolve image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # 上游同步触发的构建带一个可回溯的标签，只有 workflow_dispatch 且传了值时才生成
            type=raw,value=${{ inputs.extra_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.extra_tag != '' }}

      # 多架构构建：TARGETARCH 由 buildx 按平台自动注入，prepare.mjs 据此下载对应架构内核
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # 真正跑一次镜像：确认 Web UI 能起来、Linux 内核能在容器里被拉起并返回版本号
  smoke:
    name: Smoke test image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
        run: |
          echo "image: $IMAGE"
          docker run -d --name clash-party-smoke \
            -p 8080:8080 \
            -e CLASH_PARTY_WEBUI_PASSWORD=smoke-test \
            -e TZ=Asia/Shanghai \
            "$IMAGE"

      - name: Report image size
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
        run: |
          bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE")
          awk -v b="$bytes" 'BEGIN { printf "image size (uncompressed): %.1f MB\n", b / 1024 / 1024 }'

      - name: Wait for web UI
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              echo
              echo "web ui is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::web ui did not come up"
          docker logs clash-party-smoke
          exit 1

      - name: Verify login and renderer assets
        run: |
          set -eux
          # 未登录访问首页应返回内置登录页
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Clash Party'
          # 浏览器端 shim 必须可访问
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/web-shim.js | grep -q 200
          # 错误密码应被拒绝
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/login \
            -H 'Content-Type: application/json' -d '{"password":"wrong"}')
          test "$code" = "401"
          # 正确密码应签发会话
          curl -fsS -c /tmp/cookies.txt -X POST http://127.0.0.1:8080/api/login \
            -H 'Content-Type: application/json' -d '{"password":"smoke-test"}'
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8080/ | grep -q 'web-shim.js'

      - name: Verify Sub-Store proxy and preview link
        run: |
          set -eux
          base=http://127.0.0.1:8080
          # 前端默认后端是官方 https://sub.store，容器里必须被改回同源 /substore
          curl -fsS -b /tmp/cookies.txt "$base/substore" -o /tmp/substore.html
          grep -q 'hostAPI' /tmp/substore.html
          grep -q '<base href="/substore/">' /tmp/substore.html
          # 同源代理出来的后端要活着（后端返回的是带缩进的 JSON）
          curl -fsS -b /tmp/cookies.txt "$base/substore/api/utils/env" | grep -q '"status": *"success"'
          # 造一条"本地内容"类型的单条订阅（以前下载会 500）
          code=''
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/create.json -w '%{http_code}' -b /tmp/cookies.txt \
              -X POST "$base/substore/api/subs" -H 'Content-Type: application/json' \
              -d '{"name":"smoke-file","displayName":"Smoke File","type":"file","source":"local","content":"proxies:\n  - name: Smoke-A\n    type: ss\n    server: 1.1.1.1\n    port: 443\n    cipher: aes-128-gcm\n    password: smoke\n"}' || true)
            [ "$code" = "201" ] && break
            sleep 2
          done
          test "$code" = "201"
          # 下载链接要返回配置本身，而不是 SPA 的 HTML
          curl -fsS -b /tmp/cookies.txt "$base/substore/download/smoke-file?target=ClashMeta" -o /tmp/smoke.yaml
          grep -q 'Smoke-A' /tmp/smoke.yaml
          if grep -q '<!DOCTYPE html>' /tmp/smoke.yaml; then
            echo "::error::download link returned the SPA page instead of the config"
            exit 1
          fi
          # 预览链接：Sub-Store 分享出去的就是这个形状
          dl="$base/substore/download/smoke-file?target=ClashMeta"
          preview="$base/preview?url=$(jq -rn --arg u "$dl" '$u|@uri')&name=Smoke"
          curl -fsS -b /tmp/cookies.txt "$preview" -o /tmp/preview.html
          grep -q 'Sub-Store' /tmp/preview.html
          grep -q '<base href="/substore/">' /tmp/preview.html
          echo "sub-store proxy, download and preview link OK"

      - name: Verify mihomo core inside container
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sS -b /tmp/cookies.txt -X POST http://127.0.0.1:8080/api/invoke \
              -H 'Content-Type: application/json' \
              -d '{"channel":"mihomoVersion","args":[]}' || true)
            echo "$body"
            if echo "$body" | grep -q '"version"'; then
              echo "mihomo core is running inside the container"
              exit 0
            fi
            sleep 3
          done
          echo "::error::mihomo core did not respond"
          docker logs clash-party-smoke
          exit 1

      - name: Verify smart core inside container
        run: |
          set -eux
          # 三个内核在构建阶段都被 strip 过，这里把内核切成 mihomo-smart 再拉起一次，
          # 确认剥离符号表之后 Smart 内核仍然可用（镜像里最值钱的功能）
          curl -fsS -b /tmp/cookies.txt -X POST http://127.0.0.1:8080/api/invoke \
            -H 'Content-Type: application/json' \
            -d '{"channel":"patchAppConfig","args":[{"core":"mihomo-smart"}]}' > /dev/null
          curl -fsS -b /tmp/cookies.txt -X POST http://127.0.0.1:8080/api/send \
            -H 'Content-Type: application/json' \
            -d '{"channel":"restartCore","args":[]}' > /dev/null
          for i in $(seq 1 40); do
            body=$(curl -sS -b /tmp/cookies.txt -X POST http://127.0.0.1:8080/api/invoke \
              -H 'Content-Type: application/json' \
              -d '{"channel":"mihomoVersion","args":[]}' || true)
            echo "$body"
            if echo "$body" | grep -q '"version"'; then
              echo "smart core is running inside the container"
              exit 0
            fi
            sleep 3
          done
          echo "::error::smart core did not respond after switching"
          docker logs clash-party-smoke
          exit 1

      - name: Dump container logs
        if: always()
        run: docker logs clash-party-smoke || true
